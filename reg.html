<html>
<head>
<title>Registration Form</title>
<link type="stylesheet"href="style.css">
<style>
body
{
	background-color:#FFFF333;
}
</style>
</head>
<center>
<h1>Registration Page</h1>
<form action="Registration"method="GET">
<label>First Name</label><input type="text"name="Fname">
<br><br>
<label>Last Name</label><input type="text"name="Lname">
<br><br>
<Label>Date of Birth</Label><input type="Date"name="dob">
<br><br>
<label>Email</label>
<input type="email"name="email">
<br><br>
<label>Gender</label>
<input type="radio"name="Gender">Male</input>
<input type="radio"name="Gender">Female</input>
<br><br>
<label>Phone Number</label>
<input type="Phone Number"name="Phno">
<br><br>
<label>Address</label>
<input type="text area"rows=5 cols=5 name="addr">
<br><br>
<input type="checkbox">Accept Terms And Conditions
<br><br>
<label>Branch</label>
<select name="ops">
<option value=01>CSE</option>
<option value=02>CSM</option>
<option value=03>EEE</option>
<option value=04>ECE</option>
</select>
<br><br><br><br>
<button type="submit">SUBMIT</button>
<button type="reset">RESET</button>
</form>
</center>
</body>
</html>
